[project]
name = "futures-ctp"
version = "0.1.0"
readme = "readme.md"
requires-python = ">=3.14"
dependencies = [
    "ctpwrapper>=6.7.13",
    "cython>=3.2.6",
    "fastapi[standard]>=0.139.0",
    "pymongo>=4.17.0",
    "fommon",
]

[tool.uv.workspace]
members = ["lib/fommon"]

[tool.uv.sources]
fommon = { workspace = true }

[tool.pyright]
typeCheckingMode = "standard"
